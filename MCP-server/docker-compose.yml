version: "3.8"

services:
  mcp-server:
    build: .
    image: mcp-server:latest
    container_name: mcp-server
    ports:
      - "8080:8080"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./source:/app/source:rw
    networks:
      - mcp-agent-ui
    restart: unless-stopped


  agent-server:
    build: "../AI Agent"
    container_name: agent-server
    ports:
      - "3001:3001"
    environment:
      - MCP_URL=http://mcp-server:8080/mcp
      - OLLAMA_URL=http://host.docker.internal:11434
    depends_on:
      - mcp-server
      #- ollama
    networks:
      - mcp-agent-ui
    restart: unless-stopped

  ui:
    build: ../UI
    container_name: ui
    command: npx vite --host 0.0.0.0
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://agent-server:3001
    depends_on:
      - agent-server
    networks:
      - mcp-agent-ui
    restart: unless-stopped

networks:
  mcp-agent-ui:
    driver: bridge

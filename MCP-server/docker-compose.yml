version: "3.8"

services:
  mcp-server:
    build: .
    image: mcp-server:latest
    container_name: mcp-server
    ports:
      - "8080:8080"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./source:/app/source:ro
      - ./output:/app/output:rw
    networks:
      - mcp-agent-ui
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ./ollama-data:/root/.ollama
    networks:
      - mcp-agent-ui
    restart: unless-stopped

networks:
  mcp-agent-ui:
    driver: bridge

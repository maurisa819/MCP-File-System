version: "3.8"

services:
  mcp-server:
    build: .
    image: mcp-server:latest
    container_name: mcp-server
    ports:
      - "8080:8080"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./source:/app/source:ro
      - ./output:/app/output:rw
    networks:
      - mcp-agent-ui
    restart: unless-stopped

  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: ollama
  #   deploy:
  #     resources:
  #       limits:
  #         cpus: "5.0"
  #         memory: "8g"
  #   environment:
  #     - OLLAMA_KEEP_ALIVE=24
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ./ollama-data:/root/.ollama
  #   networks:
  #     - mcp-agent-ui
  #   restart: unless-stopped

  # Uncomment this section if you want to use the UI server 
  #from the UI directory instead of the AI Agent directory. 
  # Make sure to adjust the paths and ports accordingly.
  # agent-server:
  #   build: ../UI
  #   container_name: agent-server
  #   command: npx tsx src/server.ts
  #   ports:
  #     - "3002:3001"
  #   environment:
  #     - MCP_URL=http://mcp-server:8080/mcp
  #     - OLLAMA_URL=http://ollama:11434
  #   depends_on:
  #     - mcp-server
  #     - ollama
  #   networks:
  #     - mcp-agent-ui
  #   restart: unless-stopped

  # This is the agent server from the AI Agent directory. It serves 
  # as the backend for the UI and interacts with the MCP server and Ollama.
  # Make sure to adjust the paths and ports if you switch to the UI server.
  agent-server:
    build: "../AI Agent"
    container_name: agent-server
    ports:
      - "3001:3001"
    environment:
      - MCP_URL=http://mcp-server:8080/mcp
      - OLLAMA_URL=http://host.docker.internal:11434
    depends_on:
      - mcp-server
      #- ollama
    networks:
      - mcp-agent-ui
    restart: unless-stopped

  ui:
    build: ../UI
    container_name: ui
    command: npx vite --host 0.0.0.0
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://agent-server:3001
    depends_on:
      - agent-server
    networks:
      - mcp-agent-ui
    restart: unless-stopped

networks:
  mcp-agent-ui:
    driver: bridge
